# Параметры ноды по умолчанию. Любой можно переопределить аргументом launch
# (mode:=strict) или --ros-args -p mode:=strict.
metro_obstacle_detector:
  ros__parameters:
    # Топик PointCloud2. Пусто — нода сама ждёт и берёт первый топик этого типа.
    input_topic: ""
    # Режим ядра: default (геометрия + проверяющий классификатор; без классификатора —
    # geometry) | geometry (только геометрия) | strict (минимум ложных) | soft (дальше
    # по крупным объектам).
    mode: "default"
    # Файл модели проверяющего классификатора (текст LightGBM). Пусто — модель из пакета ядра.
    verify_model: ""
    # Ось «вперёд» в осях лидара: auto | x | -x | y | -y.
    forward_axis: "auto"
    # Результаты в JSON Lines (строка на кадр). Пусто или none — не писать.
    # Каталог (с «/» на конце) — на каждый источник свой файл
    # results_<bag или топик>_<YYYYmmdd-HHMMSS>.jsonl; шаблон с {name}/{time} — то же
    # со своим именем; обычный файл — дописывается, прошлые прогоны не стираются.
    results_path: ""
    # Имя источника для имени файла; пусто — имя топика (launch с bag:= подставляет имя bag).
    results_tag: ""
    # true — фиктивное ядро, только для проверки обвязки (то же: METRO_FAKE_CORE=1).
    fake_core: false
    # Габарит и дальность — передаются в ядро (и в отрисовку коридора в RViz).
    gauge_half_width: 1.05  # полуширина габарита от оси пути, м
    gauge_height: 3.0  # высота габарита над полотном, м
    max_range: 200.0  # дальше ось пути не строится, м
    # Надёжность подписки: auto (как у издателя) | reliable | best_effort.
    input_reliability: "auto"
    # глубина очереди входа: не терять кадры при пачках от источника (1 — только свежий)
    input_depth: 5
    # Публиковать тождественный TF <frame облака> -> lidar_link для RViz.
    publish_tf: true
